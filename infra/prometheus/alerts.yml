groups:
  - name: fairxai-service
    rules:
      - alert: High5xxRate
        expr: |
          sum(rate(fairxai_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(fairxai_requests_total[5m])), 1e-9) > 0.05
        for: 2m
        labels: {severity: page}
        annotations: {summary: "5xx rate above 5% for 2 minutes"}
      - alert: HighPredictLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(fairxai_request_latency_seconds_bucket{endpoint="/v1/predict"}[5m]))) > 0.5
        for: 5m
        labels: {severity: warn}
        annotations: {summary: "p95 /v1/predict latency above 0.5 s for 5 minutes"}
      - alert: SlotDown
        expr: up{job="serving"} == 0
        for: 1m
        labels: {severity: page}
        annotations: {summary: "serving slot {{ $labels.slot }} is down"}
      - alert: ActiveSlotWithoutModel
        expr: |
          (max by (slot) (gateway_active_slot) == 1)
            unless on (slot) (max by (slot) (fairxai_model_loaded) == 1)
        for: 1m
        labels: {severity: page}
        annotations: {summary: "active slot {{ $labels.slot }} has no model loaded"}
      - alert: PredictionLogFailures
        expr: increase(fairxai_log_failures_total[5m]) > 0
        for: 0m
        labels: {severity: warn}
        annotations: {summary: "prediction log writes are failing"}
