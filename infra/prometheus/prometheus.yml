global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: serving
    static_configs:
      - targets: ["serving-blue:8000"]
        labels: {slot: blue}
      - targets: ["serving-green:8000"]
        labels: {slot: green}
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
