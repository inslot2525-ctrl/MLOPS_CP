[project]
name = "fairxai"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2,<3",
  "pyyaml",
  "psycopg[binary]>=3.1",
  "httpx",
  "pandas",
  "scikit-learn",
  "xgboost",
  "optuna",
  "joblib",
  "mlflow==3.17.1",
  "boto3",
  "great-expectations",
  "xlrd",
  "fairlearn",
  "shap",
  "evidently==0.7.23",
  "matplotlib",
  "fastapi",
  "uvicorn[standard]",
  "prometheus-client",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pytest-httpserver"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: long-running", "full: needs Airflow", "db: needs Postgres (FAIRXAI_TEST_DB_URL)"]

[tool.ruff]
line-length = 110
target-version = "py311"
